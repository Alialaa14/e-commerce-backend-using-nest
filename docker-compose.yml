version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fashionconnect-postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: fashionconnect
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fashionconnect-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  localstack:
    image: localstack/localstack-pro:latest
    container_name: fashionconnect-localstack
    ports:
      - '4566:4566'
    environment:
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
      - SERVICES=s3,sqs,sns,ses
      - DEBUG=1
    volumes:
      - localstack_data:/var/lib/localstack
      - '/var/run/docker.sock:/var/run/docker.sock'
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  localstack_data:
